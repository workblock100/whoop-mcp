# Replace `whoop-mcp-yourname` with your unique fly.io app name.
# Run `fly launch --no-deploy` to scaffold, then edit this file, then `fly deploy`.

app = "whoop-mcp-yourname"
primary_region = "iad"

[build]

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  TOKEN_STORE_PATH = "/data/tokens.json"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "whoop_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
